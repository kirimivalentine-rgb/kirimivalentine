<script type="text/javascript">
  var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();
  (function(){
    var s1 = document.createElement("script"), s0 = document.getElementsByTagName("script")[0];
    s1.async = true;
    s1.src = 'https://embed.tawk.to/6a0af484c744531c43732cd7/1jotcmabk';
    s1.charset = 'UTF-8';
    s1.setAttribute('crossorigin', '*');
    s0.parentNode.insertBefore(s1, s0);
  })();
</script>

<script>
  /* ── Contact Form ── */
  const form = document.getElementById('contactForm');
  const success = document.getElementById('formSuccess');
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const data = new FormData(form);
    try {
      const res = await fetch(form.action, {
        method: 'POST', body: data, headers: { 'Accept': 'application/json' }
      });
      if (res.ok) { form.style.display = 'none'; success.style.display = 'block'; }
    } catch(err) { alert('Message sent!'); }
  });

  /* ── AI Panel open/close ── */
  const toggle  = document.getElementById('ai-toggle');
  const panel   = document.getElementById('ai-panel');
  const closeBtn = document.getElementById('ai-close');

  toggle.addEventListener('click', () => panel.classList.toggle('open'));
  closeBtn.addEventListener('click', () => panel.classList.remove('open'));

  /* ── Tabs ── */
  document.querySelectorAll('.ai-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.ai-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab).classList.add('active');
    });
  });

  /* ── Switch to Human tab from header button ── */
  document.getElementById('switch-to-human').addEventListener('click', () => {
    document.querySelectorAll('.ai-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector('[data-tab="human-tab"]').classList.add('active');
    document.getElementById('human-tab').classList.add('active');
    panel.classList.add('open');
  });

  /* ── Tawk.to: Open live chat ── */
  document.getElementById('open-tawk').addEventListener('click', (e) => {
    e.preventDefault();
    if (typeof Tawk_API !== 'undefined') {
      if (typeof Tawk_API.maximize === 'function') {
        Tawk_API.maximize();
      } else {
        Tawk_API.onLoad = function() {
          Tawk_API.maximize();
        };
      }
    } else {
      window.open('https://embed.tawk.to/6a0af484c744531c43732cd7/1jotcmabk', '_blank');
    }
  });

  /* ── Auto-grow textarea ── */
  const input = document.getElementById('ai-input');
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 100) + 'px';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });
  document.getElementById('ai-send').addEventListener('click', sendMsg);

  /* ── Suggestion chips ── */
  document.querySelectorAll('.ai-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const q = chip.dataset.q;
      document.getElementById('ai-chips').style.display = 'none';
      addMsg(q, 'user');
      callClaude(q);
    });
  });

  /* ── Message helpers ── */
  const msgs = document.getElementById('ai-msgs');

  function addMsg(html, role) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `<div class="msg-bubble">${html}</div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typing';
    div.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function sendMsg() {
    const q = input.value.trim();
    if (!q) return;
    document.getElementById('ai-chips').style.display = 'none';
    addMsg(q, 'user');
    input.value = '';
    input.style.height = 'auto';
    callClaude(q);
  }

  /* ── Claude AI Integration ── */
  const SYSTEM_PROMPT = `You are Valentine's personal AI assistant embedded on his portfolio website.
Answer questions about him warmly, professionally, and concisely based ONLY on the information below.
Use simple HTML formatting when helpful (e.g. <strong>, <br>). Keep replies under 150 words unless listing publications.
If asked something not covered, say you don't have that detail and suggest emailing kirimivalentine@gmail.com.

NAME: Kirimi Valentine Muriira
LOCATION: Nairobi, Kenya
EMAIL: kirimivalentine@gmail.com
PHONE: +254 746 414 833
LINKEDIN: https://www.linkedin.com/in/valentine-kirimi-851602280
STATUS: Open to opportunities

SUMMARY:
Dedicated educator and researcher specialising in Learning, Design & Technology, Mathematics, and Chemistry.
Has 8 international peer-reviewed publications. Currently completing a Master's by Research at INTI International
University, Malaysia. Experienced with IGCSE Cambridge and CBE curricula. Passionate about AI in education,
instructional design, and technology integration.

EDUCATION:
1. Master of Education in Learning, Design & Technology — INTI International University, Nilai, Malaysia
   (May 2024 – April 2026, By Research)
2. Bachelor of Education Science (Mathematics & Chemistry) — The Catholic University of Eastern Africa (2019–2023)

EXPERIENCE:
1. Mathematics Teacher — Al-Ahagaaf International Schools, Mukalla, Yemen (Aug 2024 – Sep 2025) — IGCSE Cambridge
2. Mathematics & Chemistry Teacher — Faith Sultan Mohamed School, Boorama, Somaliland (Aug 2022 – May 2024)
3. Mathematics & Chemistry Teacher — Highridge Girls Secondary School, Nairobi (Apr 2022 – Aug 2022)
4. VR Attendant & Co-Technician — Stedmak Gardens, Karen Rd, Nairobi
   (team management, customer service, sales & marketing)

SKILLS:
Instructional Design, Curriculum Development, Technology Integration, Digital Learning,
Research & Academic Writing, Evaluation & Assessment, Content Creation,
Teaching Maths & Chemistry, IGCSE & CBE Curricula, English & Swahili

PUBLICATIONS (8 peer-reviewed):
1. Technology-Enhanced Education for Neurodiverse Learners: A Bibliometric Approach
   — Educational Process: International Journal, 18 (2025)
   — http://doi.org/10.22521/edupij.2025.18.428

2. Generative AI and Educational Assessment: A Bibliometric Mapping
   — Springer Nature Switzerland, book chapter (2025)
   — https://doi.org/10.1007/978-3-032-05306-0_3

3. Digital Frontiers in the Battle Against Violence and Forced Migration: A Bibliometric Analysis
   — Preprint (2025)
   — https://doi.org/10.21203/rs.3.rs-8161995/v1

4. Trends and Emerging Research Impact of AI in Climate Change Monitoring
   — IEEE EarthSense 2025
   — https://doi.org/10.1109/EarthSense66084.2025.11297307

5. Artificial Intelligence and Sustainable Entrepreneurship Nexus
   — Entrepreneurship and Sustainability Issues, 13(3) (2026)
   — http://doi.org/10.9770/n3433346968

6. Exploring AI's Role in Educational Data Mining
   — IJORAS, 8(1), 20–31 (2026)
   — https://doi.org/10.33093/ijoras.2026.8.1.3

7. The Impact of AI on Educational Content Creation
   — IJORAS, 8(1), 32–43 (2026)
   — https://doi.org/10.33093/ijoras.2026.8.1.4

8. AI-Augmented Mobile and Data-Driven Decision Making in Business
   — IJIM, 20(07), 123–137 (2026)
   — https://doi.org/10.3991/ijim.v20i07.61107

AWARDS & ACHIEVEMENTS:
- IEEE EarthSense 2025 — Research Paper Presenter (Sep 2025)
- International Digital Education Conference 2025 — Silver Award Winner (Oct 2025)
- ICSE 2025 Sustainable Education — Participant (Sep 2025)
- NexSymp 2025 — Reviewer, Science & Technology (Sep 2025)
- 3rd International Article Writing Competition — Co-author of 2 articles (2025)
- Workshop on Proposal Defense & Viva Voce — Attendee (Jul 2025)`;

  let chatHistory = [];
  let isWaiting = false;

  async function callClaude(q) {
    if (isWaiting) return;
    isWaiting = true;
    document.getElementById('ai-send').style.opacity = '0.5';
    document.getElementById('ai-send').style.pointerEvents = 'none';

    chatHistory.push({ role: 'user', content: q });
    addTyping();

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: SYSTEM_PROMPT,
          messages: chatHistory
        })
      });

      const data = await res.json();
      removeTyping();

      const reply = data.content?.find(b => b.type === 'text')?.text
        || "Sorry, I couldn't get a response right now. Please try again.";

      chatHistory.push({ role: 'assistant', content: reply });
      addMsg(reply, 'bot');

    } catch (err) {
      removeTyping();
      addMsg(
        'Sorry, something went wrong. You can reach Valentine directly at ' +
        '<a class="msg-link" href="mailto:kirimivalentine@gmail.com">kirimivalentine@gmail.com</a>',
        'bot'
      );
    }

    isWaiting = false;
    document.getElementById('ai-send').style.opacity = '1';
    document.getElementById('ai-send').style.pointerEvents = 'auto';
  }
</script>
