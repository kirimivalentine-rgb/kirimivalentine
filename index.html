<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kirimi Valentine | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #c8a96e;
      --primary-dark: #a8893e;
      --dark: #080c10;
      --card: #0e1318;
      --border: #1e2730;
      --text: #8a9ab0;
      --white: #e8edf2;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--white);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(200,169,110,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(200,169,110,0.05) 0%, transparent 50%);
      pointer-events: none;
    }

    nav {
      position: fixed; top: 0; width: 100%; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 60px;
      background: rgba(8,12,16,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem; color: var(--primary);
      letter-spacing: 1px;
    }
    nav ul { list-style: none; display: flex; gap: 32px; }
    nav ul a {
      color: var(--text); text-decoration: none;
      font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase;
      transition: color 0.3s;
    }
    nav ul a:hover { color: var(--primary); }

    header {
      min-height: 100vh;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center;
      padding: 120px 20px 60px;
      position: relative; z-index: 1;
    }

    .avatar-wrap {
      position: relative;
      width: 160px; height: 160px;
      margin-bottom: 32px;
    }
    .avatar-wrap::before {
      content: '';
      position: absolute; inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), transparent, var(--primary-dark));
      animation: spin 8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .avatar {
      position: relative; z-index: 1;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: var(--card);
      border: 4px solid var(--dark);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .avatar-initials {
      font-family: 'Playfair Display', serif;
      font-size: 3rem; color: var(--primary);
      font-weight: 800;
    }

    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(200,169,110,0.1); border: 1px solid rgba(200,169,110,0.3);
      padding: 7px 18px; border-radius: 30px;
      font-size: 0.8rem; color: var(--primary);
      letter-spacing: 1px; margin-bottom: 20px;
    }
    .badge::before { content: '●'; font-size: 0.6rem; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800; line-height: 1.1;
      margin-bottom: 16px;
    }
    header h1 span { color: var(--primary); }

    .tagline {
      font-size: 1rem; color: var(--text);
      max-width: 560px; line-height: 1.8;
      margin-bottom: 40px;
    }

    .btn-group { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

    .btn {
      padding: 13px 30px; border-radius: 6px;
      font-weight: 600; text-decoration: none;
      font-size: 0.88rem; letter-spacing: 0.5px;
      transition: all 0.3s; cursor: pointer; border: none;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-primary { background: var(--primary); color: #080c10; }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }
    .btn-outline { border: 1px solid var(--border); color: var(--white); background: transparent; }
